<title>My Sister, My Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#04050a;overflow:hidden;font-family:Georgia,'Times New Roman',serif;}
body{display:flex;align-items:center;justify-content:center;}
.scene{position:relative;aspect-ratio:760/1166;height:88vh;max-width:92vw;overflow:hidden;border-radius:2px;box-shadow:0 40px 120px rgba(0,0,0,.85);background:#000;transform:scale(1);transition:transform 13s cubic-bezier(.16,.7,.25,1);}

canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.rays{position:absolute;inset:-25%;background:radial-gradient(ellipse at 50% 38%,rgba(232,201,138,.14),transparent 60%);filter:blur(30px);animation:drift 19s ease-in-out infinite;pointer-events:none;}

.finalImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.8s ease;}
.finalImg.show{opacity:1;}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .7s ease;}
.flash.on{opacity:.22;transition:opacity .05s ease;}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 18vh 6vh rgba(0,0,0,.75);pointer-events:none;}
.title{position:absolute;left:0;right:0;bottom:9%;text-align:center;color:#000;font-size:clamp(18px,3.2vw,32px);font-weight:700;letter-spacing:.4em;text-transform:uppercase;opacity:0;transform:translateY(14px);transition:opacity 2.4s ease,transform 2.4s ease,letter-spacing 2.4s ease;text-shadow:none;pointer-events:none;}
.title.show{opacity:1;transform:translateY(0);letter-spacing:.28em;}
.replay{position:absolute;bottom:3%;right:3%;background:transparent;border:1px solid rgba(245,237,224,.35);color:rgba(245,237,224,.7);padding:6px 14px;font-size:11px;letter-spacing:.15em;border-radius:20px;cursor:pointer;opacity:0;transition:opacity 1s ease;text-transform:uppercase;font-family:inherit;}
.replay.show{opacity:1;}
.replay:hover{border-color:rgba(245,237,224,.7);color:#fff;}
</style></head>

const N=GW*GH;

const scene=document.getElementById('scene');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const finalImg=document.getElementById('finalImg');

function resize(){const r=scene.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);}
window.addEventListener('resize',()=>{resize();layout();});

const tx=new Float32Array(N),ty=new Float32Array(N),sx=new Float32Array(N),sy=new Float32Array(N),cxA=new Float32Array(N),cyA=new Float32Array(N),delay=new Float32Array(N),dur=new Float32Array(N),fsz=new Float32Array(N);

function rand(a,b){return a+Math.random()*(b-a);}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}

let cw=0,ch=0,cellW=0,cellH=0;
function layout(){
  resize();
  cw=canvas.width;ch=canvas.height;
  cellW=cw/GW;cellH=ch/GH;
  const cX=cw/2, cY=ch/2;
  const maxDist=Math.hypot(cX,cY);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const i=gy*GW+gx;
    const px=(gx+.5)*cellW, py=(gy+.5)*cellH;
    tx[i]=px;ty[i]=py;
    const ang=rand(0,Math.PI*2);
    const off=Math.pow(Math.random(),1.8)*rand(180,cw*0.9);
    sx[i]=px+Math.cos(ang)*off; sy[i]=py+Math.sin(ang)*off*0.6-rand(0,cw*0.15);
    cxA[i]=(px+sx[i])/2+Math.cos(ang+1.57)*rand(-90,90);
    cyA[i]=(py+sy[i])/2+Math.sin(ang+1.57)*rand(-90,90);
    const d=Math.hypot(px-cX,py-cY)/maxDist;
    delay[i]=d*3.3+rand(0,.7);
    dur[i]=rand(.9,1.7);
    fsz[i]=Math.max(cellW,cellH)*rand(.92,1.15);
  }
}

  for(const d of dust){
    d.x+=Math.sin(elapsedAtmo*.3+d.ph)*0.00006+d.sp*0.00025;
    d.y-=d.sp*0.00035;
    if(d.y<0)d.y=1;if(d.x>1)d.x=0;if(d.x<0)d.x=1;
    const a=(0.3+0.3*Math.sin(elapsedAtmo*1.3+d.ph*3))*dustAlpha;
    ctx.fillStyle='rgba(240,225,190,'+a.toFixed(3)+')';
    ctx.beginPath();ctx.arc(d.x*cw,d.y*ch,d.r*devicePixelRatio,0,6.283);ctx.fill();
  }
  if(now>=formationStart){
    const t=(now-formationStart)/1000;
    for(let i=0;i<N;i++){
      const li=(t-delay[i])/dur[i];
      if(li<0)continue;
      const cl=li>1?1:li;
      const e=easeOutCubic(cl);
      const u=1-e;
      const x=u*u*sx[i]+2*u*e*cxA[i]+e*e*tx[i];
      const y=u*u*sy[i]+2*u*e*cyA[i]+e*e*ty[i];
      const alpha=smooth(cl/0.35);
      let sz=cellW*1.05;
      if(cl<1){
        const pop=1+Math.sin(cl*Math.PI)*0.55*(1-cl);
        sz=Math.max(1.2,fsz[i]*(0.4+0.6*e))*pop*0.9;
      }
      ctx.globalAlpha=alpha;
      ctx.fillStyle='rgb('+R[i]+','+G[i]+','+B[i]+')';
      ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
    }
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}
requestAnimationFrame(draw);
begin();
</script>
