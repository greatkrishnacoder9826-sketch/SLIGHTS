<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision-Fly Creations</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#04050a;overflow:hidden;font-family:Georgia,'Times New Roman',serif;}
body{display:flex;align-items:center;justify-content:center;}
.scene{position:relative;aspect-ratio:640/1133;height:88vh;max-width:92vw;overflow:hidden;border-radius:2px;box-shadow:0 40px 120px rgba(0,0,0,.85);background:#000;transform:scale(1);transition:transform 13s cubic-bezier(.16,.7,.25,1);}
.scene.zoom{transform:scale(1.06);}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.rays{position:absolute;inset:-25%;background:radial-gradient(ellipse at 50% 38%,rgba(160,190,232,.14),transparent 60%);filter:blur(30px);animation:drift 19s ease-in-out infinite;pointer-events:none;}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(2%,-2%) rotate(2deg);}}
.finalImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.8s ease;}
.finalImg.show{opacity:1;}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .7s ease;}
.flash.on{opacity:.22;transition:opacity .05s ease;}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 18vh 6vh rgba(0,0,0,.75);pointer-events:none;}
.title{position:absolute;left:0;right:0;bottom:9%;text-align:center;color:#f5ede0;font-size:clamp(16px,3vw,28px);letter-spacing:.4em;text-transform:uppercase;opacity:0;transform:translateY(14px);transition:opacity 2.4s ease,transform 2.4s ease,letter-spacing 2.4s ease;text-shadow:0 0 18px rgba(160,190,232,.55),0 0 40px rgba(160,190,232,.25);pointer-events:none;}
.title.show{opacity:1;transform:translateY(0);letter-spacing:.28em;}
.replay{position:absolute;bottom:3%;right:3%;background:transparent;border:1px solid rgba(245,237,224,.35);color:rgba(245,237,224,.7);padding:6px 14px;font-size:11px;letter-spacing:.15em;border-radius:20px;cursor:pointer;opacity:0;transition:opacity 1s ease;text-transform:uppercase;font-family:inherit;}
.replay.show{opacity:1;}
.replay:hover{border-color:rgba(245,237,224,.7);color:#fff;}
</style></head>

let cw=0,ch=0,cellW=0,cellH=0;
function layout(){
  resize();
  cw=canvas.width;ch=canvas.height;
  cellW=cw/GW;cellH=ch/GH;
  const cX=cw/2, cY=ch/2;
  const maxDist=Math.hypot(cX,cY);

  requestAnimationFrame(draw);
  if(!startTime)return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cw,ch);
  const elapsedAtmo=(now-startTime)/1000;
  const dustAlpha=Math.max(0,1-elapsedAtmo/9.5)*.5+.06;
  ctx.globalCompositeOperation='lighter';
  for(const d of dust){
    d.x+=Math.sin(elapsedAtmo*.3+d.ph)*0.00006+d.sp*0.00025;
    d.y-=d.sp*0.00035;
    if(d.y<0)d.y=1;if(d.x>1)d.x=0;if(d.x<0)d.x=1;
    const a=(0.3+0.3*Math.sin(elapsedAtmo*1.3+d.ph*3))*dustAlpha;
    ctx.fillStyle='rgba(240,225,190,'+a.toFixed(3)+')';
    ctx.beginPath();ctx.arc(d.x*cw,d.y*ch,d.r*devicePixelRatio,0,6.283);ctx.fill();
  }
  if(now>=formationStart){
    const t=(now-formationStart)/1000;
    for(let i=0;i<N;i++){
      const li=(t-delay[i])/dur[i];
      if(li<0)continue;
      const cl=li>1?1:li;
      const e=easeOutCubic(cl);
      const u=1-e;
      const x=u*u*sx[i]+2*u*e*cxA[i]+e*e*tx[i];
      const y=u*u*sy[i]+2*u*e*cyA[i]+e*e*ty[i];
      const alpha=smooth(cl/0.35);
      let sz=cellW*1.05;
      if(cl<1){
        const pop=1+Math.sin(cl*Math.PI)*0.55*(1-cl);
        sz=Math.max(1.2,fsz[i]*(0.4+0.6*e))*pop*0.9;
      }
      ctx.globalAlpha=alpha;
      ctx.fillStyle='rgb('+R[i]+','+G[i]+','+B[i]+')';
      ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
    }
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}
requestAnimationFrame(draw);
begin();
</script>
